name: Publish memoQ MCP server

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Build memoQ bridge helper (.NET 4.8)
        run: pnpm build:memoq-helper
      - name: Test
        run: pnpm test
      - name: Build publishable memoQ MCP package
        run: pnpm package:memoq-mcp
      - name: Verify packaged tool discovery and calls
        shell: bash
        run: |
          set -euo pipefail
          smoke_dir=$(mktemp -d)
          trap 'rm -rf -- "$smoke_dir"' EXIT
          windows_path=$(cygpath -m "$smoke_dir")
          npm install --prefix "$windows_path" --registry=https://registry.npmjs.org --ignore-scripts --no-audit --no-fund \
            ./packages/memoq-mcp/dist-package/*.tgz zod@4.4.3
          node packages/memoq-mcp/test/packaged-smoke.mjs \
            "$windows_path/node_modules/@langlink/memoq-mcp/dist/index.js"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: memoq-mcp
          path: packages/memoq-mcp/dist-package/*.tgz
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: npm-release
    permissions:
      id-token: write
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: memoq-mcp
          path: release
      - name: Publish verified tarball with npm Trusted Publishing
        run: npm publish ./release/*.tgz --access public --ignore-scripts
